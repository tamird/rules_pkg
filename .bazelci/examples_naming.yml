common: &common
  working_directory: ../examples/naming_package_files
  build_targets:
  - "..."
  - "@rules_pkg//tests/zip:test_zip_empty"

tasks:
  ubuntu2204:
    platform: ubuntu2204
    # Exercise the archive writers without the host program used by the script bootstrap.
    build_flags:
    - "--@rules_python//python/config_settings:bootstrap_impl=script"
    - "--sandbox_block_path=/usr/bin/env"
    <<: *common
  macos:
    platform: macos
    <<: *common
  windows:
    platform: windows
    <<: *common
